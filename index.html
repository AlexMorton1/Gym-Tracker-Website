<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header-controls">
        <div>
            <h1>Team Habits</h1>
            <div class="subtitle">Shared across everyone using this app</div>
        </div>
        <div class="controls-row">
            <button id="add-person-btn" class="btn">+ Add person</button>
            <select id="habit-selector"></select>
        </div>
    </div>

    <div id="tracker-container">
        <div class="status-line">Loading tracker…</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
